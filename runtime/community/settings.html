<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'"><title>Nani Community — 接続設定</title><link rel="stylesheet" href="settings.css"></head>
<body><main><header><small>NANI COMMUNITY</small><h1>翻訳エンジンの設定</h1><p>高速モデルの翻訳は、このPCで動くPLaMoを使います。高度なモデル・解説・要約・会話にはChatGPTを使います。</p></header>
<section><h2>PLaMo · ローカル翻訳</h2><form id="plamo"><label>サーバーURL<input name="url" type="url" required></label><label>モデル名<input name="model" required></label><label>日本語の文体<select name="form"><option value="polite">です・ます</option><option value="plain">だ・である</option></select></label><label>用語集 <span>1行に「原語 = 訳語」</span><textarea name="glossary" rows="4" placeholder="OpenAI = OpenAI"></textarea></label><div class="actions"><button type="submit">保存</button><button type="button" id="test" class="secondary">接続をテスト</button></div></form></section>
<section><h2>ChatGPT · 解説・要約・会話</h2><p id="chatgpt-status">未接続。PLaMoの翻訳はログインなしで利用できます。</p><div id="chatgpt-controls"></div></section><p id="message" role="status" aria-live="polite"></p><footer>通常版と設定・履歴を分けて保存します。<code id="profile"></code></footer></main><script src="settings.js"></script></body></html>
