name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ github.token }}
          nix_conf: |
            access-tokens = github.com=${{ github.token }}

      - name: Check Just recipes and run tests
        run: nix develop -c bash -c 'just --fmt --check && just test'

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check shell scripts
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh scripts/watchdog/*.sh runtime/start.sh.template

      - name: Check Nix flake
        run: nix flake check
