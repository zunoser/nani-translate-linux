name: Upstream watchdog

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this artifact and patch implementation were already checked
        type: boolean
        default: false

permissions: {}

concurrency:
  group: upstream-watchdog
  cancel-in-progress: false

jobs:
  verify-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
    outputs:
      pins: ${{ steps.pins.outputs.changed }}
    env:
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read the last verification
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { findStateIssue, decodeState } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/watchdog/state.mjs`);
            const issue = await findStateIssue(github, context.repo);
            require('node:fs').writeFileSync('watchdog-previous.json', JSON.stringify(decodeState(issue?.body)));
      - name: Probe metadata and skip already checked inputs
        id: probe
        env:
          FORCE: ${{ inputs.force }}
        run: node scripts/watchdog/probe.mjs
      - name: Install build dependencies
        if: steps.probe.outputs.build == 'true'
        run: sudo apt-get update && sudo apt-get install --yes build-essential p7zip-full python3 xvfb xauth
      - name: Verify the exact detected artifact
        id: verify
        if: steps.probe.outputs.build == 'true'
        env:
          NANI_RELEASE_FILE: ${{ github.workspace }}/watchdog-release.json
        shell: bash
        run: |
          status=0
          bash scripts/build-app.sh >watchdog-build.log 2>&1 || status=$?
          BUILD_STATUS="$status" node scripts/watchdog/result.mjs
          if [ "$status" -ne 0 ]; then tail -n 80 watchdog-build.log; fi
      - name: Smoke test the isolated application
        id: smoke
        if: steps.verify.outputs.compatible == 'true'
        run: |
          status=0
          # Provision Chromium's supported setuid sandbox on the disposable
          # runner; keep the application sandbox enabled during the smoke test.
          sudo chown root:root nani-app/chrome-sandbox
          sudo chmod 4755 nani-app/chrome-sandbox
          node scripts/smoke-app.mjs nani-app dist/reports || status=$?
          BUILD_STATUS="$status" BUILD_STAGE=smoke node scripts/watchdog/result.mjs
      - name: Prepare verified pin update
        if: steps.smoke.outputs.compatible == 'true'
        run: |
          status=0
          node scripts/prepare-pins.mjs dist/reports verified-pins.json >watchdog-pins.log 2>&1 || status=$?
          PIN_STATUS="$status" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const state = JSON.parse(fs.readFileSync('watchdog-result.json', 'utf8'));
          if (process.env.PIN_STATUS === '0') {
            state.verifiedPins = JSON.parse(fs.readFileSync('verified-pins.json', 'utf8'));
          } else {
            state.status = 'infrastructure';
            state.failures = [{ id: 'pin-download', detail: 'Build passed, but pin preparation failed. See watchdog-pins.log.' }];
          }
          fs.writeFileSync('watchdog-result.json', JSON.stringify(state));
          NODE
      - name: Check for an outstanding pin proposal
        id: pins
        run: |
          if [ -f verified-pins.json ] && ! cmp -s verified-pins.json nix/upstream-nani.json; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Keep diagnostic reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watchdog-diagnostics
          retention-days: 14
          path: |
            watchdog-*.json
            verified-pins.json
            watchdog-*.log
            dist/reports/*.json
            dist/reports/smoke.log
            dist/reports/build-info.env

  report:
    needs: verify-upstream
    if: needs.verify-upstream.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watchdog-diagnostics
          path: watchdog-diagnostics
      - name: Update one issue without repeated comments
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { reportState } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/watchdog/state.mjs`);
            const state = JSON.parse(require('node:fs').readFileSync('watchdog-diagnostics/watchdog-result.json', 'utf8'));
            await reportState(github, context.repo, state);

  propose-update:
    needs: verify-upstream
    if: needs.verify-upstream.outputs.pins == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watchdog-diagnostics
          path: watchdog-diagnostics
      - name: Propose verified pins and dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/watchdog/open-pin-pr.sh
